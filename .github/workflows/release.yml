# Undelete Messages — build the release APK and publish it as a GitHub Release.
#
# How to use:
#   1. Put this file at .github/workflows/release.yml in the repo.
#   2. Add two repository secrets (Settings > Secrets and variables > Actions):
#        KEYSTORE_B64          base64 of ~/keystores/notify-ecosystem.jks
#                              (on the nuc:  base64 -w0 ~/keystores/notify-ecosystem.jks)
#        ECOSYSTEM_STORE_PASS  content of ~/keystores/notify-ecosystem.pass
#   3. Run it from the Actions tab (workflow_dispatch), or push a tag like v1.3.2.
#      The release is created with the tag you enter / push, and the APK is
#      uploaded under the fixed name Undelete-Messages.apk so the README's
#      "latest download" link keeps working.

name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.3.2)"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore the ecosystem keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/keystores"
          echo "$KEYSTORE_B64" | base64 -d > "$HOME/keystores/notify-ecosystem.jks"

      - name: Build the release APK
        env:
          ECOSYSTEM_STORE_PASS: ${{ secrets.ECOSYSTEM_STORE_PASS }}
        run: gradle :core:assembleRelease --console=plain

      - name: Stage the APK under its stable download name
        run: cp core/build/outputs/apk/release/core-release.apk Undelete-Messages.apk

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Undelete Messages ${{ inputs.tag || github.ref_name }}
          files: Undelete-Messages.apk
