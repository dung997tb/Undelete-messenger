# Undelete Messages — build the release APK and publish it as a GitHub Release.
#
# This file goes to: .github/workflows/release.yml  (replace the whole file)
# It is the ONLY code the release flow needs. The two secrets below are values
# from the nuc, not code — add them once under
# Settings > Secrets and variables > Actions > New repository secret:
#   ECOSYSTEM_STORE_PASS : output of  cat ~/keystores/notify-ecosystem.pass
#   KEYSTORE_B64         : output of  base64 -w0 ~/keystores/notify-ecosystem.jks
# Then run from the Actions tab with a tag like v1.3.1, or push a v* tag.

name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.3.1)"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform 35 and build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Restore the ecosystem keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/keystores"
          echo "$KEYSTORE_B64" | base64 -d > "$HOME/keystores/notify-ecosystem.jks"

      - name: Build the release APK
        env:
          ECOSYSTEM_STORE_PASS: ${{ secrets.ECOSYSTEM_STORE_PASS }}
        run: gradle :core:assembleRelease --console=plain

      - name: Stage the APK under its stable download name
        run: cp core/build/outputs/apk/release/core-release.apk Undelete-Messages.apk

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Undelete Messages ${{ inputs.tag || github.ref_name }}
          files: Undelete-Messages.apk
